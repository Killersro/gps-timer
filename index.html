<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Hours Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#2e2e2e;
    --accent:#c8f060;--accent-dim:#8aab2a;--text:#f0f0f0;--muted:#888;
    --danger:#ff5f5f;--safe:#60d4a8;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;max-width:430px;margin:0 auto}

  /* Header */
  .header{padding:20px 20px 0;flex-shrink:0}
  .header h1{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.15em;text-transform:uppercase}
  .header .subtitle{font-size:12px;color:var(--muted);margin-top:2px}

  /* Tabs */
  .tabs{display:flex;gap:4px;padding:16px 20px 0;flex-shrink:0}
  .tab{flex:1;padding:9px 0;border-radius:10px;border:none;background:var(--surface);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
  .tab.active{background:var(--accent);color:#0f0f0f;font-weight:700}

  /* Scrollable content */
  .content{flex:1;overflow-y:auto;padding:16px 20px 32px;-webkit-overflow-scrolling:touch}

  /* Active session bar */
  .session-bar{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:none}
  .session-bar.visible{display:block}
  .session-bar .loc-name{font-size:15px;font-weight:600;color:var(--accent)}
  .session-bar .timer{font-family:'Space Mono',monospace;font-size:26px;color:var(--text);margin:4px 0}
  .session-bar .since{font-size:11px;color:var(--muted)}
  .btn-checkout{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:none;background:var(--danger);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.1s}
  .btn-checkout:active{transform:scale(.97)}

  /* Location cards */
  .loc-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;transition:.15s;position:relative;overflow:hidden}
  .loc-card:active{background:var(--surface2)}
  .loc-card.checked-in{border-color:var(--accent);background:rgba(200,240,96,.06)}
  .loc-card .loc-header{display:flex;justify-content:space-between;align-items:flex-start}
  .loc-card .loc-title{font-size:16px;font-weight:600}
  .loc-card .loc-meta{font-size:12px;color:var(--muted);margin-top:3px}
  .loc-card .loc-hours{font-family:'Space Mono',monospace;font-size:20px;color:var(--accent);font-weight:700}
  .loc-card .loc-badge{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--accent);color:#0f0f0f;font-weight:700}
  .loc-card .loc-actions{display:flex;gap:8px;margin-top:12px}
  .loc-card .btn-sm{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.1s}
  .loc-card .btn-sm:active{background:var(--surface2)}
  .loc-card .btn-sm.primary{background:var(--accent);border-color:var(--accent);color:#0f0f0f;font-weight:700}
  .loc-card .btn-sm.danger{border-color:var(--danger);color:var(--danger)}
  .gps-dot{width:8px;height:8px;border-radius:50%;background:var(--safe);display:inline-block;margin-right:5px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* Add location */
  .add-form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
  .add-form h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--accent)}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none}
  .field input:focus{border-color:var(--accent)}
  .field input::placeholder{color:var(--muted)}
  .btn-add{width:100%;padding:11px;border-radius:10px;border:none;background:var(--accent);color:#0f0f0f;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:.1s}
  .btn-add:active{transform:scale(.97)}
  .btn-capture{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;margin-top:4px;transition:.15s}
  .btn-capture:active{border-color:var(--accent);color:var(--accent)}
  .coord-display{font-size:11px;color:var(--safe);margin-top:4px;font-family:'Space Mono',monospace}

  /* History */
  .hist-entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .hist-entry .h-name{font-size:14px;font-weight:600}
  .hist-entry .h-time{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);margin-top:2px}
  .hist-entry .h-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .hist-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}

  /* Stats tab */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
  .stat-card .s-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .stat-card .s-value{font-family:'Space Mono',monospace;font-size:22px;color:var(--accent);margin-top:4px;font-weight:700}
  .stat-card .s-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .bar-chart{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px}
  .bar-chart h3{font-size:13px;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em}
  .bar-row{margin-bottom:10px}
  .bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .bar-label span:last-child{font-family:'Space Mono',monospace;color:var(--accent)}
  .bar-track{background:var(--border);border-radius:4px;height:6px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}

  /* Toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;transition:.3s;white-space:nowrap;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* GPS overlay */
  .gps-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
  .gps-overlay.visible{display:flex}
  .gps-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;width:280px}
  .gps-card h3{font-size:16px;font-weight:600;margin-bottom:8px}
  .gps-card p{font-size:13px;color:var(--muted);line-height:1.5}
  .gps-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:16px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty-state .icon{font-size:40px;margin-bottom:12px;opacity:.3}
  .empty-state p{font-size:14px;line-height:1.5}
</style>
</head>
<body>

<div class="header">
  <h1>Hours Tracker</h1>
  <div class="subtitle" id="gps-status">GPS off</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('locations')">Locations</button>
  <button class="tab" onclick="showTab('history')">History</button>
  <button class="tab" onclick="showTab('stats')">Stats</button>
</div>

<div class="content" id="tab-locations">
  <!-- Active session -->
  <div class="session-bar" id="session-bar">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="loc-name" id="sess-name">—</div>
        <div class="since" id="sess-since"></div>
      </div>
      <div class="loc-hours" id="sess-timer" style="font-size:22px">0:00:00</div>
    </div>
    <button class="btn-checkout" onclick="checkOut()">Check out</button>
  </div>

  <!-- Location list -->
  <div class="section-title" id="loc-section-title">Your locations</div>
  <div id="loc-list"></div>

  <!-- Add form -->
  <div class="add-form">
    <h3>+ New location</h3>
    <div class="field">
      <label>Name</label>
      <input type="text" id="new-name" placeholder="e.g. Office, Gym, Library…">
    </div>
    <div class="field">
      <label>GPS radius (meters, optional)</label>
      <input type="number" id="new-radius" placeholder="100" value="100">
    </div>
    <div class="field">
      <label>Coordinates (optional — for auto-detect)</label>
      <input type="text" id="new-coords" placeholder="tap button to capture">
      <div class="coord-display" id="coord-preview"></div>
    </div>
    <button class="btn-capture" onclick="captureGPS()">📍 Capture my current GPS location</button>
    <button class="btn-add" onclick="addLocation()" style="margin-top:10px">Add location</button>
  </div>
</div>

<div class="content" id="tab-history" style="display:none">
  <div class="section-title">Session history</div>
  <div id="hist-list"></div>
</div>

<div class="content" id="tab-stats" style="display:none">
  <div class="stats-grid" id="stats-summary"></div>
  <div class="bar-chart" id="bar-chart">
    <h3>Hours by location</h3>
    <div id="bar-rows"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="gps-overlay" id="gps-overlay">
  <div class="gps-card">
    <div class="gps-spinner"></div>
    <h3>Getting location…</h3>
    <p id="gps-overlay-msg">Please wait while we capture your GPS coordinates.</p>
  </div>
</div>

<!-- Edit modal -->
<div class="gps-overlay" id="edit-overlay">
  <div class="gps-card" style="width:300px">
    <h3 style="margin-bottom:16px">Edit location</h3>
    <div class="field" style="text-align:left">
      <label>Name</label>
      <input type="text" id="edit-name" placeholder="Location name">
    </div>
    <div class="field" style="text-align:left">
      <label>Coordinates (lat, lng)</label>
      <input type="text" id="edit-coords" placeholder="e.g. 48.1234, 17.5678">
    </div>
    <div class="field" style="text-align:left">
      <label>GPS radius (meters)</label>
      <input type="number" id="edit-radius" placeholder="100">
    </div>
    <button class="btn-capture" onclick="editCaptureGPS()" style="margin-bottom:10px">📍 Use my current GPS location</button>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn-sm" style="flex:1;padding:10px" onclick="closeEditModal()">Cancel</button>
      <button class="btn-sm primary" style="flex:1;padding:10px" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let state = {
  locations: [],
  sessions: [],
  activeSession: null,
  capturedCoords: null
};

const STORAGE_KEY = 'hours_tracker_v2';

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function load() {
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    if (d) state = JSON.parse(d);
  } catch(e) {}
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function showTab(name) {
  ['locations','history','stats'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t === name ? 'block' : 'none';
    document.querySelectorAll('.tab')[['locations','history','stats'].indexOf(t)].classList.toggle('active', t === name);
  });
  if (name === 'history') renderHistory();
  if (name === 'stats') renderStats();
}

// ── Locations ──────────────────────────────────────────────────────────────
function renderLocations() {
  var list = document.getElementById('loc-list');
  var title = document.getElementById('loc-section-title');
  if (state.locations.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">&#128205;</div><p>No locations yet.<br>Add one below to get started.</p></div>';
    title.style.display = 'none';
    return;
  }
  title.style.display = 'block';
  var html = '';
  for (var i = 0; i < state.locations.length; i++) {
    var loc = state.locations[i];
    var totalMs = totalMillis(loc.id);
    var active = state.activeSession && state.activeSession.locId === loc.id;
    var metaHTML = (loc.lat && loc.lng)
      ? '<span class="gps-dot"></span>GPS: ' + loc.lat.toFixed(4) + ', ' + loc.lng.toFixed(4) + ' (' + loc.radius + 'm)'
      : 'Manual only';
    var badgeHTML = active ? '<div class="loc-badge">ACTIVE</div>' : '';
    var checkinBtn = active
      ? '<button class="btn-sm danger" onclick="checkOut()">Check out</button>'
      : '<button class="btn-sm primary" onclick="checkIn(event.currentTarget)" data-id="' + loc.id + '">Check in</button>';
    var editBtn   = '<button class="btn-sm" onclick="editLocation(event.currentTarget)" data-id="' + loc.id + '">Edit</button>';
    var deleteBtn = '<button class="btn-sm danger" onclick="deleteLocation(event.currentTarget)" data-id="' + loc.id + '">Delete</button>';
    html += '<div class="loc-card ' + (active ? 'checked-in' : '') + '" id="card-' + loc.id + '">'
      + '<div class="loc-header">'
      + '<div>'
      + '<div class="loc-title">' + loc.name + '</div>'
      + '<div class="loc-meta">' + metaHTML + '</div>'
      + '</div>'
      + '<div style="text-align:right">'
      + '<div class="loc-hours">' + formatDuration(totalMs) + '</div>'
      + badgeHTML
      + '</div>'
      + '</div>'
      + '<div class="loc-actions" onclick="event.stopPropagation()">'
      + checkinBtn + editBtn + deleteBtn
      + '</div>'
      + '</div>';
  }
  list.innerHTML = html;
}

function addLocation() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { toast('Enter a location name'); return; }
  const radius = parseInt(document.getElementById('new-radius').value) || 100;
  let coords = state.capturedCoords;
  if (!coords) {
    const raw = document.getElementById('new-coords').value.trim();
    if (raw) {
      const parts = raw.split(',').map(s => parseFloat(s.trim()));
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        coords = { lat: parts[0], lng: parts[1] };
      } else {
        toast('Invalid coordinates — use: 48.1234, 17.5678'); return;
      }
    }
  }
  const loc = {
    id: Date.now().toString(),
    name,
    radius,
    lat: coords ? coords.lat : null,
    lng: coords ? coords.lng : null
  };
  state.locations.push(loc);
  save();
  document.getElementById('new-name').value = '';
  document.getElementById('new-coords').value = '';
  document.getElementById('coord-preview').textContent = '';
  state.capturedCoords = null;
  renderLocations();
  toast(`"${name}" added`);
}

function deleteLocation(elOrId) {
  var id = (typeof elOrId === 'string') ? elOrId : elOrId.getAttribute('data-id');
  if (state.activeSession && state.activeSession.locId === id) {
    toast("Can't delete while checked in"); return;
  }
  const loc = state.locations.find(l => l.id === id);
  if (!confirm(`Delete "${loc.name}"?`)) return;
  state.locations = state.locations.filter(l => l.id !== id);
  save();
  renderLocations();
}

let editingId = null;

function editLocation(elOrId) {
  var id = (typeof elOrId === 'string') ? elOrId : elOrId.getAttribute('data-id');
  const loc = state.locations.find(l => l.id === id);
  editingId = id;
  document.getElementById('edit-name').value = loc.name;
  document.getElementById('edit-coords').value = (loc.lat && loc.lng) ? `${loc.lat}, ${loc.lng}` : '';
  document.getElementById('edit-radius').value = loc.radius || 100;
  document.getElementById('edit-overlay').classList.add('visible');
}

function closeEditModal() {
  document.getElementById('edit-overlay').classList.remove('visible');
  editingId = null;
}

function saveEdit() {
  const loc = state.locations.find(l => l.id === editingId);
  if (!loc) return;
  const name = document.getElementById('edit-name').value.trim();
  if (!name) { toast('Name cannot be empty'); return; }
  const radius = parseInt(document.getElementById('edit-radius').value) || 100;
  const raw = document.getElementById('edit-coords').value.trim();
  let lat = null, lng = null;
  if (raw) {
    const parts = raw.split(',').map(s => parseFloat(s.trim()));
    if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      lat = parts[0]; lng = parts[1];
    } else {
      toast('Invalid coordinates — use: 48.1234, 17.5678'); return;
    }
  }
  loc.name = name;
  loc.radius = radius;
  loc.lat = lat;
  loc.lng = lng;
  save();
  closeEditModal();
  renderLocations();
  toast(`"${name}" updated`);
}

function editCaptureGPS() {
  if (!navigator.geolocation) { toast('GPS not available'); return; }
  document.getElementById('gps-overlay').classList.add('visible');
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('gps-overlay').classList.remove('visible');
    document.getElementById('edit-coords').value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
  }, err => {
    document.getElementById('gps-overlay').classList.remove('visible');
    toast('GPS error: ' + err.message);
  }, {enableHighAccuracy: true, timeout: 15000});
}

function totalMillis(locId) {
  let total = 0;
  state.sessions.filter(s => s.locId === locId && s.end).forEach(s => total += s.end - s.start);
  if (state.activeSession && state.activeSession.locId === locId) {
    total += Date.now() - state.activeSession.start;
  }
  return total;
}

function formatDuration(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function formatDurationFull(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ── Check in / out ─────────────────────────────────────────────────────────
function checkIn(elOrId) {
  var locId = (typeof elOrId === 'string') ? elOrId : elOrId.getAttribute('data-id');
  if (state.activeSession) {
    toast('Already checked in — check out first');
    return;
  }
  const loc = state.locations.find(l => l.id === locId);
  state.activeSession = { locId, start: Date.now() };
  save();
  renderLocations();
  updateSessionBar();
  toast(`Checked in to ${loc.name}`);
}

function checkOut() {
  if (!state.activeSession) return;
  const sess = state.activeSession;
  sess.end = Date.now();
  state.sessions.push(sess);
  state.activeSession = null;
  save();
  const loc = state.locations.find(l => l.id === sess.locId);
  const dur = sess.end - sess.start;
  toast(`Checked out — ${formatDuration(dur)} logged`);
  renderLocations();
  updateSessionBar();
}

// ── Session bar ────────────────────────────────────────────────────────────
function updateSessionBar() {
  const bar = document.getElementById('session-bar');
  if (!state.activeSession) {
    bar.classList.remove('visible');
    return;
  }
  bar.classList.add('visible');
  const loc = state.locations.find(l => l.id === state.activeSession.locId);
  document.getElementById('sess-name').textContent = loc ? loc.name : 'Unknown';
  const d = new Date(state.activeSession.start);
  document.getElementById('sess-since').textContent = 'Since ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

let timerInterval = null;
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state.activeSession) return;
    const elapsed = Date.now() - state.activeSession.start;
    document.getElementById('sess-timer').textContent = formatDurationFull(elapsed);
    // also update active card total
    const loc = state.locations.find(l => l.id === state.activeSession.locId);
    if (loc) {
      const el = document.querySelector(`#card-${loc.id} .loc-hours`);
      if (el) el.textContent = formatDuration(totalMillis(loc.id));
    }
  }, 1000);
}

// ── GPS ────────────────────────────────────────────────────────────────────
let watchId = null;
let lastPos = null;

function startGPSWatch() {
  if (!navigator.geolocation) {
    document.getElementById('gps-status').textContent = 'GPS not supported';
    return;
  }
  watchId = navigator.geolocation.watchPosition(pos => {
    lastPos = pos;
    document.getElementById('gps-status').textContent =
      `GPS: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)} (±${Math.round(pos.coords.accuracy)}m)`;
    checkAutoLocation(pos);
  }, err => {
    document.getElementById('gps-status').textContent = 'GPS: ' + err.message;
  }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 30000});
}

function checkAutoLocation(pos) {
  if (state.activeSession) {
    const activeLoc = state.locations.find(l => l.id === state.activeSession.locId);
    if (activeLoc && activeLoc.lat && activeLoc.lng) {
      const dist = haversine(pos.coords.latitude, pos.coords.longitude, activeLoc.lat, activeLoc.lng);
      if (dist > activeLoc.radius) {
        const name = activeLoc.name;
        checkOut();
        toast('Left ' + name + ' — checked out automatically');
      }
    }
    return;
  }
  const nearest = findNearestLocation(pos);
  if (nearest && nearest.dist <= nearest.loc.radius) {
    checkIn(nearest.loc.id);
  }
}

function findNearestLocation(pos) {
  let best = null, bestDist = Infinity;
  state.locations.forEach(loc => {
    if (!loc.lat || !loc.lng) return;
    const dist = haversine(pos.coords.latitude, pos.coords.longitude, loc.lat, loc.lng);
    if (dist < bestDist) { bestDist = dist; best = {loc, dist}; }
  });
  return best;
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function captureGPS() {
  if (!navigator.geolocation) { toast('GPS not available'); return; }
  document.getElementById('gps-overlay').classList.add('visible');
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('gps-overlay').classList.remove('visible');
    state.capturedCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    document.getElementById('new-coords').value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
    document.getElementById('coord-preview').textContent = `±${Math.round(pos.coords.accuracy)}m accuracy`;
  }, err => {
    document.getElementById('gps-overlay').classList.remove('visible');
    toast('GPS error: ' + err.message);
  }, {enableHighAccuracy: true, timeout: 15000});
}

// ── History ────────────────────────────────────────────────────────────────
function renderHistory() {
  var list = document.getElementById('hist-list');
  var all = state.sessions.slice().sort(function(a,b){ return b.start - a.start; });
  if (all.length === 0) {
    list.innerHTML = '<div class="hist-empty">No sessions yet.<br>Check in to a location first.</div>';
    return;
  }
  list.innerHTML = all.map(function(s) {
    var loc = state.locations.find(function(l){ return l.id === s.locId; });
    var name = loc ? loc.name : 'Deleted location';
    var start = new Date(s.start);
    var end = s.end ? new Date(s.end) : null;
    var dur = s.end ? s.end - s.start : Date.now() - s.start;
    var timeOpts = {hour:'2-digit', minute:'2-digit'};
    var endStr = end ? ' &rarr; ' + end.toLocaleTimeString([], timeOpts) : ' &middot; ongoing';
    return '<div class="hist-entry">'
      + '<div class="h-name">' + name + '</div>'
      + '<div class="h-time">' + formatDuration(dur) + '</div>'
      + '<div class="h-meta">' + start.toLocaleDateString() + ' &middot; ' + start.toLocaleTimeString([], timeOpts) + endStr + '</div>'
      + '</div>';
  }).join('');
}

// ── Stats ──────────────────────────────────────────────────────────────────
function renderStats() {
  var allSess = state.sessions;
  var totalMs = allSess.reduce(function(s,e){ return s + (e.end - e.start); }, 0);
  var today = new Date(); today.setHours(0,0,0,0);
  var todayTime = today.getTime();
  var todaySess = allSess.filter(function(s){ return s.start >= todayTime; });
  var todayMs = todaySess.reduce(function(s,e){ return s + (e.end - e.start); }, 0);
  var week = new Date(today); week.setDate(week.getDate() - 7);
  var weekMs = allSess.filter(function(s){ return s.start >= week.getTime(); }).reduce(function(s,e){ return s + (e.end - e.start); }, 0);

  document.getElementById('stats-summary').innerHTML =
    '<div class="stat-card"><div class="s-label">Today</div><div class="s-value">' + formatDuration(todayMs) + '</div><div class="s-sub">' + todaySess.length + ' sessions</div></div>'
    + '<div class="stat-card"><div class="s-label">This week</div><div class="s-value">' + formatDuration(weekMs) + '</div><div class="s-sub">7-day total</div></div>'
    + '<div class="stat-card"><div class="s-label">All time</div><div class="s-value">' + formatDuration(totalMs) + '</div><div class="s-sub">' + allSess.length + ' sessions</div></div>'
    + '<div class="stat-card"><div class="s-label">Locations</div><div class="s-value">' + state.locations.length + '</div><div class="s-sub">tracked</div></div>';

  var byLoc = {};
  state.locations.forEach(function(l){ byLoc[l.id] = {name: l.name, ms: 0}; });
  allSess.forEach(function(s){ if (byLoc[s.locId]) byLoc[s.locId].ms += (s.end - s.start); });
  var sorted = Object.values(byLoc).sort(function(a,b){ return b.ms - a.ms; });
  var maxMs = (sorted[0] && sorted[0].ms) ? sorted[0].ms : 1;

  if (sorted.length === 0) {
    document.getElementById('bar-rows').innerHTML = '<div style="color:var(--muted);font-size:13px">No data yet</div>';
    return;
  }
  document.getElementById('bar-rows').innerHTML = sorted.map(function(r) {
    return '<div class="bar-row">'
      + '<div class="bar-label"><span>' + r.name + '</span><span>' + formatDuration(r.ms) + '</span></div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:' + Math.round(r.ms/maxMs*100) + '%"></div></div>'
      + '</div>';
  }).join('');
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimeout;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Init ───────────────────────────────────────────────────────────────────
load();
renderLocations();
updateSessionBar();
startTimer();
startGPSWatch();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
